# Blueprint de Render: crea de un tirón la base de datos y el backend.
# En dashboard.render.com → New → Blueprint, conecta este repo y Render
# lee este archivo automáticamente.
#
# Los valores marcados con `sync: false` son secretos (claves de API,
# contraseñas, tokens): Render los deja vacíos y te los pide a TI en el
# propio dashboard al crear el blueprint — nunca se escriben aquí ni los
# rellena nadie más.

databases:
  - name: lead-qualifier-db
    plan: free          # gratis 30 días; después hay que pasar a un plan de pago o se borra
    region: frankfurt    # más cerca de España que las regiones en EE. UU.
    databaseName: leadqualifier
    user: leadqualifier

services:
  - type: web
    name: lead-qualifier-backend
    runtime: python
    plan: free           # gratis; se "duerme" tras 15 min sin tráfico (arranque lento al despertar)
    region: frankfurt
    rootDir: lead-qualifier
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # BD: se conecta sola a la base de datos de arriba
      - key: DATABASE_URL
        fromDatabase:
          name: lead-qualifier-db
          property: connectionString

      # Obligatorio
      - key: ANTHROPIC_API_KEY
        sync: false

      # Auth Clerk (obligatorio en producción; usa la instancia de
      # PRODUCTION de Clerk, no la de development)
      - key: CLERK_JWKS_URL
        sync: false

      # CORS / URL del dashboard
      - key: DASHBOARD_URL
        value: https://www.inmuebia.es

      # Panel de administración + cifrado de contraseñas IMAP
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: SUPER_ADMIN_USER_ID
        sync: false
      - key: FERNET_KEY
        sync: false

      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_AGENCIA
        sync: false

      # Email transaccional
      - key: FROM_EMAIL
        value: contacto@inmuebia.es
      - key: FROM_NAME
        value: Inmuebia
      - key: SENDGRID_API_KEY
        sync: false

      # WhatsApp (opcional — si se deja vacío, esos avisos quedan desactivados)
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false

      # Monitorización (opcional)
      - key: SENTRY_DSN
        sync: false
